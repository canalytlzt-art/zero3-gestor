openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sales
    description: Private sales data
  - name: products
    description: Product names derived from sales
  - name: occupancy
    description: Registros e importações de ocupação
paths:
  /occupancy/modalities:
    get:
      operationId: getOccupancyModalities
      tags: [occupancy]
      responses:
        "200":
          description: Modalidades cadastradas
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyModality" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    post:
      operationId: createOccupancyModality
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyModalityInput" }
      responses:
        "201":
          description: Modalidade criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyModality" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/modalities/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOccupancyModality
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyModalityUpdate" }
      responses:
        "200":
          description: Modalidade renomeada com vínculos preservados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyModality" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    delete:
      operationId: deleteOccupancyModality
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyModalityDelete" }
      responses:
        "200":
          description: Modalidade excluída; aulas removidas e produtos desvinculados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyModalityDeletion" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-goals:
    get:
      operationId: getOccupancyMonthlyGoals
      tags: [occupancy]
      summary: List monthly occupancy and aggregator targets
      parameters:
        - { in: query, name: fromMonth, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
        - { in: query, name: toMonth, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: Monthly targets, including modality-scoped targets
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyMonthlyGoal" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-goals/{month}:
    parameters:
      - { in: path, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
    put:
      operationId: upsertOccupancyMonthlyGoal
      tags: [occupancy]
      summary: Create or update monthly occupancy and aggregator targets
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyMonthlyGoalInput" }
      responses:
        "200":
          description: Monthly targets saved for the selected modality scope
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyMonthlyGoal" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-aggregator-adjustments:
    get:
      operationId: getOccupancyMonthlyAggregatorAdjustments
      tags: [occupancy]
      summary: List monthly aggregator adjustments
      parameters:
        - { in: query, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
      responses:
        "200":
          description: Monthly aggregator adjustments, including inactive adjustments
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustment" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-aggregator-adjustments/preview:
    post:
      operationId: previewOccupancyMonthlyAggregatorAdjustment
      tags: [occupancy]
      summary: Preview a proportional monthly aggregator adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustmentInput" }
      responses:
        "200":
          description: Read-only preview of eligible classes and proportional allocation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustmentPreview" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-aggregator-adjustments/{month}:
    parameters:
      - { in: path, name: month, required: true, schema: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' } }
    put:
      operationId: saveOccupancyMonthlyAggregatorAdjustment
      tags: [occupancy]
      summary: Save or update a previewed monthly aggregator adjustment
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustmentSave" }
      responses:
        "200":
          description: Adjustment saved with per-class audit entries
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustment" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/monthly-aggregator-adjustments/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    delete:
      operationId: undoOccupancyMonthlyAggregatorAdjustment
      tags: [occupancy]
      summary: Undo estimates while preserving recorded aggregator values
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustmentDelete" }
      responses:
        "204": { description: Estimated allocations removed; recorded values preserved }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy:
    get:
      operationId: getOccupancyRecords
      tags: [occupancy]
      parameters:
        - { in: query, name: fromDate, schema: { type: string }, description: Data inicial inclusiva AAAA-MM-DD }
        - { in: query, name: toDate, schema: { type: string }, description: Data final inclusiva AAAA-MM-DD }
        - { in: query, name: months, schema: { type: string }, description: Meses AAAA-MM separados por vírgula; exclusivo com intervalo }
        - { in: query, name: year, schema: { type: integer, minimum: 1900, maximum: 2100 }, description: Ano civil; pode combinar com meses ou trimestre }
        - { in: query, name: quarter, schema: { type: integer, minimum: 1, maximum: 4 }, description: "Trimestre civil: janeiro-março, abril-junho, julho-setembro ou outubro-dezembro" }
        - { in: query, name: startTimes, schema: { type: string }, description: Horários iniciais HH:mm separados por vírgula }
        - { in: query, name: weekdays, schema: { type: string }, description: "Dias da semana ISO 1-7 separados por vírgula, segunda a domingo" }
        - { in: query, name: modalityId, schema: { type: string, format: uuid } }
        - { in: query, name: className, schema: { type: string, maxLength: 120 } }
        - { in: query, name: kind, schema: { type: string, enum: [all, daily, monthly] } }
      responses:
        "200":
          description: Histórico persistido; consolidados em intervalos somente para meses completos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyRecord" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    post:
      operationId: createOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRecordInput" }
      responses:
        "201":
          description: Ocupação registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyRecord" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRecordUpdate" }
      responses:
        "200":
          description: Ocupação atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyRecord" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    delete:
      operationId: deleteOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRemovalInput" }
      responses:
        "204": { description: Registro excluído do histórico ativo; auditoria preservada }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/import/preview:
    post:
      operationId: previewOccupancyImport
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyImportPreviewInput" }
      responses:
        "200":
          description: Prévia com novos registros, reimportações e conflitos atuais
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyImportPreviewResponse" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/import:
    post:
      operationId: commitOccupancyImport
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyImportCommitInput" }
      responses:
        "200":
          description: Importação sem duplicar; conflitos concorrentes permanecem pendentes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyImportCommitResponse" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/backup/period:
    post:
      operationId: createOccupancyBackup
      tags: [occupancy]
      summary: Create a filtered occupancy backup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyBackupSelection" }
      responses:
        "200":
          description: Versioned backup of selected occupancy records and required modalities
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyBackup" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/backup/restore/preview:
    post:
      operationId: previewOccupancyBackupRestore
      tags: [occupancy]
      summary: Preview an occupancy backup before restoring it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyBackupRestorePreviewInput" }
      responses:
        "200":
          description: Restore plan with identical records and conflicts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyBackupRestorePreview" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/backup/restore:
    post:
      operationId: restoreOccupancyBackup
      tags: [occupancy]
      summary: Restore an occupancy backup after conflict confirmation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyBackupRestoreInput" }
      responses:
        "200":
          description: Occupancy records restored without changing financial records
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyBackupRestoreResult" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access-status:
    get:
      operationId: getAccessStatus
      tags: [sales]
      summary: Check whether the signed-in user is allowed into the sales app
      responses:
        "200":
          description: Authorization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products derived from persisted sales
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product in the sales catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Product name already exists or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product without changing historical sale snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data or identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Product was updated by another user or name conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales for the current workspace
      description: Returns active persisted sales records visible to the signed-in user.
      responses:
        "200":
          description: Sales records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/CreateSaleInput"
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/pending:
    get:
      operationId: getSalesPendingDrafts
      tags: [sales]
      summary: List saved financial drafts that still need required data
      responses:
        "200":
          description: Pending drafts, excluded from all financial totals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesPendingDraft"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/pending/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSalesPendingDraft
      tags: [sales]
      summary: Complete required fields and convert a draft into a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalesPendingDraftInput"
      responses:
        "200":
          description: Draft updated or converted to a confirmed sale
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UpdateSalesPendingDraftResult"
        "400":
          description: Invalid draft data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Access denied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Draft not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Draft changed or has already been converted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/import/origins:
    get:
      operationId: getSalesImportOrigins
      tags: [sales]
      summary: Read previously imported physical source rows
      parameters:
        - in: query
          name: fileHash
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      responses:
        "200":
          description: Persistent source identities, including earlier partial imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportOriginsResult"
        "400":
          description: Invalid file hash
        "401":
          description: Authentication required
        "403":
          description: Access denied
  /sales/import:
    post:
      operationId: importSales
      tags: [sales]
      summary: Import only unseen physical rows of a file, allowing partial reprocessing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesImportInput"
      responses:
        "200":
          description: Import batch already applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportResult"
        "201":
          description: Import batch applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportResult"
        "400":
          description: Invalid import payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: File content conflicts with a previously applied import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/history:
    get:
      operationId: getSalesHistory
      tags: [sales]
      summary: List active and cancelled sales for the launch history
      responses:
        "200":
          description: Complete sales history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/scoreboard:
    get:
      operationId: getSalesScoreboard
      tags: [sales]
      summary: Aggregate active sales and refunds for scoreboard filters
      parameters:
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: months
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: weekdays
          in: query
          required: false
          style: form
          explode: false
          description: Dias da semana ISO da movimentação, de segunda (1) a domingo (7)
          schema:
            type: array
            uniqueItems: true
            items:
              type: integer
              minimum: 1
              maximum: 7
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: modalityId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conciliated sales, refunds, net revenue, and quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesScoreboard"
        "400":
          description: Invalid or conflicting period filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refund-candidates:
    get:
      operationId: getSalesRefundCandidates
      tags: [sales]
      summary: List active sales with their available refund balances
      responses:
        "200":
          description: Sales that can receive refunds and their current balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesRefundCandidate"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refunds:
    get:
      operationId: getSalesRefunds
      tags: [sales]
      summary: List active and voided refunds with their original sale details
      responses:
        "200":
          description: Refund movement history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesRefundRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/refunds:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createSalesRefund
      tags: [sales]
      summary: Create an idempotent refund within the original sale balance
      requestBody:
        required: true
        content:
          application/json:
