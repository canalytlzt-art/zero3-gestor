openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sales
    description: Private sales data
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access-status:
    get:
      operationId: getAccessStatus
      tags: [sales]
      summary: Check whether the signed-in user is allowed into the sales app
      responses:
        "200":
          description: Authorization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales for the current workspace
      description: Returns the persisted sales records visible to the signed-in user.
      responses:
        "200":
          description: Sales records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Sale:
      type: object
      properties:
        id:
          type: string
        saleDate:
          type: string
        productName:
          type: string
        quantity:
          type: integer
        unitAmountCents:
          type: integer
        totalCents:
          type: integer
        notes:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - saleDate
        - productName
        - quantity
        - unitAmountCents
        - totalCents
        - notes
        - createdAt
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    AccessStatus:
      type: object
      properties:
        authorized:
          type: boolean
      required:
        - authorized

