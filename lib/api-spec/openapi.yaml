openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: sales
    description: Private sales data
  - name: products
    description: Product names derived from sales
paths:
  /occupancy/modalities:
    get:
      operationId: getOccupancyModalities
      tags: [occupancy]
      responses:
        "200":
          description: Modalidades cadastradas
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyModality" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    post:
      operationId: createOccupancyModality
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyModalityInput" }
      responses:
        "201":
          description: Modalidade criada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyModality" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/modalities/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOccupancyModality
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyModalityUpdate" }
      responses:
        "200":
          description: Modalidade renomeada com vínculos preservados
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyModality" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy:
    get:
      operationId: getOccupancyRecords
      tags: [occupancy]
      parameters:
        - { in: query, name: fromDate, schema: { type: string }, description: Data inicial inclusiva AAAA-MM-DD }
        - { in: query, name: toDate, schema: { type: string }, description: Data final inclusiva AAAA-MM-DD }
        - { in: query, name: months, schema: { type: string }, description: Meses AAAA-MM separados por vírgula; exclusivo com intervalo }
        - { in: query, name: modalityId, schema: { type: string, format: uuid } }
        - { in: query, name: className, schema: { type: string, maxLength: 120 } }
        - { in: query, name: kind, schema: { type: string, enum: [all, daily, monthly] } }
      responses:
        "200":
          description: Histórico persistido; consolidados em intervalos somente para meses completos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/OccupancyRecord" } }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    post:
      operationId: createOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRecordInput" }
      responses:
        "201":
          description: Ocupação registrada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyRecord" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /occupancy/{id}:
    parameters:
      - { in: path, name: id, required: true, schema: { type: string, format: uuid } }
    patch:
      operationId: updateOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRecordUpdate" }
      responses:
        "200":
          description: Ocupação atualizada
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OccupancyRecord" }
        default: { $ref: "#/components/responses/OccupancyFailure" }
    delete:
      operationId: deleteOccupancyRecord
      tags: [occupancy]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OccupancyRemovalInput" }
      responses:
        "204": { description: Registro excluído do histórico ativo; auditoria preservada }
        default: { $ref: "#/components/responses/OccupancyFailure" }
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /access-status:
    get:
      operationId: getAccessStatus
      tags: [sales]
      summary: Check whether the signed-in user is allowed into the sales app
      responses:
        "200":
          description: Authorization status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /products:
    get:
      operationId: getProducts
      tags: [products]
      summary: List products derived from persisted sales
      responses:
        "200":
          description: Product catalog
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createProduct
      tags: [products]
      summary: Create a product in the sales catalog
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Product name already exists or idempotency conflict
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateProduct
      tags: [products]
      summary: Update a product without changing historical sale snapshots
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProductInput"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
        "400":
          description: Invalid product data or identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Product not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Product was updated by another user or name conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales:
    get:
      operationId: getSales
      tags: [sales]
      summary: List sales for the current workspace
      description: Returns active persisted sales records visible to the signed-in user.
      responses:
        "200":
          description: Sales records
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      operationId: createSale
      tags: [sales]
      summary: Record a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
                $ref: "#/components/schemas/CreateSaleInput"
      responses:
        "201":
          description: Sale created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/import/origins:
    get:
      operationId: getSalesImportOrigins
      tags: [sales]
      summary: Read previously imported physical source rows
      parameters:
        - in: query
          name: fileHash
          required: true
          schema:
            type: string
            pattern: '^[a-f0-9]{64}$'
      responses:
        "200":
          description: Persistent source identities, including earlier partial imports
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportOriginsResult"
        "400":
          description: Invalid file hash
        "401":
          description: Authentication required
        "403":
          description: Access denied
  /sales/import:
    post:
      operationId: importSales
      tags: [sales]
      summary: Import only unseen physical rows of a file, allowing partial reprocessing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesImportInput"
      responses:
        "200":
          description: Import batch already applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportResult"
        "201":
          description: Import batch applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesImportResult"
        "400":
          description: Invalid import payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: File content conflicts with a previously applied import
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/history:
    get:
      operationId: getSalesHistory
      tags: [sales]
      summary: List active and cancelled sales for the launch history
      responses:
        "200":
          description: Complete sales history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sale"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/scoreboard:
    get:
      operationId: getSalesScoreboard
      tags: [sales]
      summary: Aggregate active sales and refunds for scoreboard filters
      parameters:
        - name: fromDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: toDate
          in: query
          required: false
          schema:
            type: string
            format: date
        - name: months
          in: query
          required: false
          style: form
          explode: false
          schema:
            type: array
            items:
              type: string
              pattern: '^\d{4}-(0[1-9]|1[0-2])$'
        - name: productId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Conciliated sales, refunds, net revenue, and quantity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesScoreboard"
        "400":
          description: Invalid or conflicting period filters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refund-candidates:
    get:
      operationId: getSalesRefundCandidates
      tags: [sales]
      summary: List active sales with their available refund balances
      responses:
        "200":
          description: Sales that can receive refunds and their current balances
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesRefundCandidate"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refunds:
    get:
      operationId: getSalesRefunds
      tags: [sales]
      summary: List active and voided refunds with their original sale details
      responses:
        "200":
          description: Refund movement history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesRefundRecord"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/refunds:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: createSalesRefund
      tags: [sales]
      summary: Create an idempotent refund within the original sale balance
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSalesRefundInput"
      responses:
        "200":
          description: Previously created refund returned for an idempotent retry
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRefund"
        "201":
          description: Refund created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRefund"
        "400":
          description: Invalid refund data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sale not found or not active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Sale balance or idempotency key conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refunds/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSalesRefund
      tags: [sales]
      summary: Correct an active refund with version and balance validation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSalesRefundInput"
      responses:
        "200":
          description: Refund corrected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRefund"
        "400":
          description: Invalid refund data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Refund changed or corrected data exceeds the sale balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refunds/{id}/void:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: voidSalesRefund
      tags: [sales]
      summary: Void a refund with a reason while preserving its history
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoidSalesRefundInput"
      responses:
        "200":
          description: Refund voided
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRefund"
        "400":
          description: Invalid void reason or identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Refund changed or is no longer active
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/refunds/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSalesRefundHistory
      tags: [sales]
      summary: Read the audit history of a refund
      responses:
        "200":
          description: Refund audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesHistoryEntry"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Refund not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales-goals:
    get:
      operationId: getSalesGoals
      tags: [sales]
      summary: List monthly sales goals
      responses:
        "200":
          description: Monthly sales goals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesGoal"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: upsertSalesGoal
      tags: [sales]
      summary: Create or update a monthly sales goal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SalesGoalInput"
      responses:
        "200":
          description: Monthly sales goal saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesGoal"
        "400":
          description: Invalid monthly sales goal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Idempotency key reused with different data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/backup:
    get:
      operationId: getMonthlySalesBackup
      tags: [sales]
      summary: Create a complete monthly sales backup
      parameters:
        - name: month
          in: query
          required: true
          schema:
            type: string
            pattern: '^\d{4}-(0[1-9]|1[0-2])$'
      responses:
        "200":
          description: Complete monthly backup including refund dependencies
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MonthlySalesBackupV2"
        "400":
          description: Invalid month
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/restore/preview:
    post:
      operationId: previewMonthlySalesBackupRestore
      tags: [sales]
      summary: Preview a monthly sales backup before restoring it
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlySalesBackupInput"
      responses:
        "200":
          description: Existing IDs, conflicts, additions, and dependency months
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRestorePreview"
        "400":
          description: Invalid backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/restore:
    post:
      operationId: restoreMonthlySalesBackup
      tags: [sales]
      summary: Restore a monthly sales backup
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MonthlySalesBackupInput"
      responses:
        "200":
          description: Backup restored without duplicating sales
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SalesRestoreResult"
        "400":
          description: Invalid backup file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    patch:
      operationId: updateSale
      tags: [sales]
      summary: Edit a sale
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateSaleInput"
      responses:
        "200":
          description: Sale updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid sale data or identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Authenticated user is not on the authorized email list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Sale changed since it was loaded or idempotency key conflicts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/cancel:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    post:
      operationId: cancelSale
      tags: [sales]
      summary: Cancel a sale with a required reason
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CancelSaleInput"
      responses:
        "200":
          description: Sale cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sale"
        "400":
          description: Invalid cancellation data or identifier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Sale changed or has active refunds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /sales/{id}/history:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
    get:
      operationId: getSaleHistory
      tags: [sales]
      summary: Read the audit history of a sale
      responses:
        "200":
          description: Audit history
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SalesHistoryEntry"
        "404":
          description: Sale not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
