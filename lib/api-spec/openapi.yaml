components:
  responses:
    OccupancyFailure:
      description: Erro de validação (400), acesso (401/403), ausência (404) ou conflito de duplicidade/versão (409)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ApiError" }
  schemas:
    OccupancyModality:
      type: object
      required: [id, name, version]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        version: { type: integer }
    OccupancyModalityInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
    OccupancyModalityUpdate:
      type: object
      required: [name, version]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        version: { type: integer, minimum: 1 }
    OccupancyModalityDelete:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    OccupancyModalityDeletion:
      type: object
      required: [modalityId, deletedRecords, unlinkedProducts]
      properties:
        modalityId: { type: string, format: uuid }
        deletedRecords: { type: integer, minimum: 0 }
        unlinkedProducts: { type: integer, minimum: 0 }
    OccupancyMonthlyGoal:
      type: object
      required: [month, modalityId, modalityName, aggregatorTargetPresences, occupancyTargetPercentage, notes, createdAt, updatedAt]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        modalityId: { type: ["string", "null"], format: uuid }
        modalityName: { type: ["string", "null"] }
        aggregatorTargetPresences: { type: ["integer", "null"], minimum: 0, maximum: 2147483647 }
        occupancyTargetPercentage: { type: ["number", "null"], minimum: 0 }
        notes: { type: ["string", "null"], maxLength: 1000 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    OccupancyMonthlyGoalInput:
      type: object
      required: [modalityId, aggregatorTargetPresences, occupancyTargetPercentage, notes]
      properties:
        modalityId: { type: ["string", "null"], format: uuid }
        aggregatorTargetPresences: { type: ["integer", "null"], minimum: 0, maximum: 2147483647 }
        occupancyTargetPercentage: { type: ["number", "null"], minimum: 0 }
        notes: { type: ["string", "null"], maxLength: 1000 }
    OccupancyMonthlyAggregatorAdjustment:
      type: object
      required: [id, month, scopeKey, modalityId, modalityName, targetPresences, version, active, createdAt, updatedAt, deletedAt]
      properties:
        id: { type: string, format: uuid }
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        scopeKey: { type: string }
        modalityId: { type: ["string", "null"], format: uuid }
        modalityName: { type: ["string", "null"] }
        targetPresences: { type: integer, minimum: 0, maximum: 2147483647 }
        version: { type: integer, minimum: 1 }
        active: { type: boolean }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: ["string", "null"], format: date-time }
    OccupancyMonthlyAggregatorAdjustmentInput:
      type: object
      required: [month, modalityId, targetPresences]
      properties:
        month: { type: string, pattern: '^\d{4}-(0[1-9]|1[0-2])$' }
        modalityId: { type: ["string", "null"], format: uuid }
        targetPresences: { type: integer, minimum: 0, maximum: 2147483647 }
    OccupancyMonthlyAggregatorAllocation:
      type: object
      required: [recordId, date, modalityName, startTime, className, presences, previousAggregatorPresences, assignedAggregatorPresences]
      properties:
        recordId: { type: string, format: uuid }
        date: { type: string }
        modalityName: { type: string }
        startTime: { type: ["string", "null"] }
        className: { type: ["string", "null"] }
        presences: { type: integer, minimum: 0 }
        previousAggregatorPresences: { type: ["integer", "null"], minimum: 0 }
        assignedAggregatorPresences: { type: integer, minimum: 0 }
    OccupancyMonthlyAggregatorAdjustmentPreview:
      type: object
      required: [month, modalityId, modalityName, targetPresences, totalPresences, recordedAggregatorPresences, previousEstimatedPresences, remainingToDistribute, otherPresences, measuredClassCount, candidateClassCount, canSave, message, expectedVersion, adjustmentId, snapshotToken, allocations]
      properties:
        month: { type: string }
        modalityId: { type: ["string", "null"], format: uuid }
        modalityName: { type: ["string", "null"] }
        targetPresences: { type: integer }
        totalPresences: { type: integer }
        recordedAggregatorPresences: { type: integer }
        previousEstimatedPresences: { type: integer }
        remainingToDistribute: { type: integer }
        otherPresences: { type: ["integer", "null"] }
        measuredClassCount: { type: integer }
        candidateClassCount: { type: integer }
        canSave: { type: boolean }
        message: { type: string }
        expectedVersion: { type: integer, minimum: 0 }
        adjustmentId: { type: string, format: uuid }
        snapshotToken: { type: string }
        allocations:
          type: array
          items: { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAllocation" }
    OccupancyMonthlyAggregatorAdjustmentSave:
      allOf:
        - { $ref: "#/components/schemas/OccupancyMonthlyAggregatorAdjustmentInput" }
        - type: object
          required: [expectedVersion, adjustmentId, snapshotToken]
          properties:
            expectedVersion: { type: integer, minimum: 0 }
            adjustmentId: { type: string, format: uuid }
            snapshotToken: { type: string, minLength: 64, maxLength: 64 }
    OccupancyMonthlyAggregatorAdjustmentDelete:
      type: object
      required: [expectedVersion]
      properties:
        expectedVersion: { type: integer, minimum: 1 }
    OccupancyRecord:
      type: object
      required: [id, kind, period, month, modalityId, modalityName, percentage, reportedPercentage, presences, capacity, startTime, endTime, className, notes, sourceFileHash, sourceSheet, sourceCell, sourceCells, version, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [daily, monthly] }
        period: { type: string }
        month: { type: string }
        modalityId: { type: string, format: uuid }
        modalityName: { type: string }
        percentage: { type: number, minimum: 0 }
        reportedPercentage: { type: ["number", "null"], minimum: 0 }
        presences: { type: ["integer", "null"], minimum: 0, maximum: 2147483647 }
        capacity: { type: ["integer", "null"], minimum: 1, maximum: 2147483647 }
        aggregatorPresences: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, description: Presenças de alunos agregadores incluídas no total; null significa não informado. }
        aggregatorSource: { type: ["string", "null"], enum: ["recorded", "monthly_estimated", null], description: Origem do valor de agregadores; distingue valores registrados das estimativas do ajuste mensal. }
        startTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        className: { type: [string, "null"] }
        notes: { type: [string, "null"] }
        sourceFileHash: { type: [string, "null"] }
        sourceSheet: { type: [string, "null"] }
        sourceCell: { type: [string, "null"] }
        sourceCells:
          anyOf:
            - type: object
              additionalProperties: { type: string }
            - type: "null"
        version: { type: integer }
        createdAt: { type: string }
        updatedAt: { type: string }
    OccupancyRecordInput:
      type: object
      required: [kind, period, modalityName]
      properties:
        kind: { type: string, enum: [daily, monthly] }
        period: { type: string, minLength: 7, maxLength: 10, description: AAAA-MM-DD para diário ou AAAA-MM para mensal }
        modalityId: { type: string, format: uuid }
        modalityName: { type: string, minLength: 1, maxLength: 120 }
        percentage: { type: number, minimum: 0, description: Para registros antigos, percentual informado. Quando presenças e capacidade forem enviados, serve como percentual de referência. }
        reportedPercentage: { type: number, minimum: 0 }
        presences: { type: integer, minimum: 0, maximum: 2147483647 }
        capacity: { type: integer, minimum: 1, maximum: 2147483647 }
        aggregatorPresences: { type: ["integer", "null"], minimum: 0, maximum: 2147483647, description: Presenças de agregadores; opcional para preservar registros sem informação. }
        startTime: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        endTime: { type: ["string", "null"], pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$' }
        className: { type: [string, "null"], maxLength: 120 }
        notes: { type: [string, "null"], maxLength: 1000 }
    OccupancyRecordUpdate:
      allOf:
        - { $ref: "#/components/schemas/OccupancyRecordInput" }
        - type: object
          required: [version]
          properties:
            version: { type: integer, minimum: 1 }
    OccupancyRemovalInput:
      type: object
      required: [version]
      properties:
        version: { type: integer, minimum: 1 }
    OccupancyImportSourceCells:
      type: object
      minProperties: 2
      maxProperties: 9
      additionalProperties:
        type: string
        pattern: '^[A-Z]{1,4}[1-9][0-9]*$'
    OccupancyImportRowInput:
      allOf:
        - $ref: "#/components/schemas/OccupancyRecordInput"
        - type: object
          required: [index, sourceSheet, sourceCell, sourceCells]
          properties:
            index: { type: integer, minimum: 0 }
            sourceSheet: { type: string, minLength: 1, maxLength: 120 }
            sourceCell: { type: string, pattern: '^[A-Z]{1,4}[1-9][0-9]*$' }
            sourceCells: { $ref: "#/components/schemas/OccupancyImportSourceCells" }
    OccupancyImportPreviewInput:
      type: object
      required: [fileHash, entries]
      properties:
        fileHash: { type: string, pattern: '^[a-f0-9]{64}$' }
        entries:
          type: array
          minItems: 1
          maxItems: 250
          items: { $ref: "#/components/schemas/OccupancyImportRowInput" }
    OccupancyImportPreviewRow:
      type: object
      required: [index, status, message, existingRecord]
      properties:
        index: { type: integer, minimum: 0 }
        status: { type: string, enum: [new, already_imported, conflict, duplicate_in_file] }
        message: { type: string }
        existingRecord:
          anyOf:
